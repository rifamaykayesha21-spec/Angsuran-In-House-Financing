<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pembayaran Angsuran - IHF Piutang</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="app-nav"></nav>
    <main>
      <div class="page-head"><h2>Pembayaran Angsuran</h2></div>
      <div class="card"><h3>Terima Pembayaran</h3>
        <form id="form"><div class="form-grid">
          <div class="full"><label>Kontrak aktif</label><select id="contract_id" required></select></div>
          <div><label>Tanggal bayar</label><input id="payment_date" type="date" required /></div>
          <div><label>Jumlah diterima</label><input id="amount" type="number" min="1" required /></div>
          <div><label>Metode</label><select id="method"><option value="cash">Tunai</option><option value="transfer">Transfer Bank</option><option value="qris">QRIS</option></select></div>
          <div><label>Catatan</label><input id="notes" /></div>
        </div>
        <div class="info" id="contract-info">Pilih kontrak untuk melihat tagihan.</div>
        <div class="actions"><button class="btn primary" id="btn-save">Simpan Pembayaran</button></div></form>
      </div>
      <div class="card"><h3>Riwayat Pembayaran</h3><div class="table-wrap"><table><thead><tr><th>No. Kwitansi</th><th>Tanggal</th><th>Kontrak</th><th>Pelanggan</th><th>Metode</th><th class=num>Denda</th><th class=num>Jumlah</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="muted">Memuat...</td></tr></tbody></table></div></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/payments.js"></script>
</body>
</html>
