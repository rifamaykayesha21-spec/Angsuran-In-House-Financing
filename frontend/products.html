<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produk - IHF Piutang</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="app-nav"></nav>
    <main>
      <div class="page-head"><h2>Produk</h2><button class="btn primary" id="btn-add">+ Produk</button></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama Produk</th><th class=num>Harga Pokok</th><th class=num>Harga Tunai</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="muted">Memuat...</td></tr></tbody></table></div></div>
    </main>
  </div>
  <div class="modal-bg" id="modal"><form class="modal" id="form">
    <h3 id="modal-title">Produk</h3><input type="hidden" id="product_id" />
    <div class="form-grid">
      <div class="full"><label>Nama produk</label><input id="product_name" required /></div>
      <div><label>Harga pokok (HPP)</label><input id="cost_price" type="number" min="0" required /></div>
      <div><label>Harga tunai</label><input id="cash_price" type="number" min="1" required /></div>
      <div><label>Status</label><select id="is_active"><option value="true">Aktif</option><option value="false">Nonaktif</option></select></div>
    </div>
    <div class="actions"><button type="button" class="btn" id="btn-cancel">Batal</button><button class="btn primary">Simpan</button></div>
  </form></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
